<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tool Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-tertiary: #1a1a1a;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-tertiary: #707070;
      --coral: #ff6b6b;
      --coral-dim: #ff8787;
      --coral-bg: rgba(255, 107, 107, 0.08);
      --border: #252525;
      --border-hover: #353535;
      --success: #4ade80;
      --warning: #fbbf24;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: 'Crimson Pro', serif;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      animation: slideDown 0.6s ease;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--coral), var(--coral-dim));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 300;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .compare-btn {
      padding: 0.625rem 1.25rem;
      background: var(--coral);
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
      display: none;
    }

    .compare-btn.active {
      display: block;
      animation: slideInRight 0.3s ease;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .compare-btn:hover {
      background: var(--coral-dim);
      transform: translateY(-1px);
    }

    .compare-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .view-toggle {
      display: flex;
      gap: 0.5rem;
      background: var(--bg-secondary);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .view-btn {
      padding: 0.5rem 1rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .view-btn.active {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .view-btn:hover:not(.active) {
      color: var(--text-primary);
    }

    /* Main Container */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    /* Rename Banner */
    .rename-banner {
      background: linear-gradient(135deg, var(--coral-bg), rgba(255, 107, 107, 0.04));
      border: 1px solid rgba(255, 107, 107, 0.2);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 3rem;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s ease 0.2s backwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .rename-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--coral), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .rename-content {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .rename-icon {
      font-size: 2.5rem;
    }

    .rename-text h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--coral);
    }

    .rename-text p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .rename-arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--coral-dim);
      font-weight: 500;
      margin-left: 0.5rem;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      animation: fadeInUp 0.8s ease 0.3s backwards;
    }

    .selection-banner {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      animation: slideDown 0.3s ease;
    }

    .selection-banner.active {
      display: flex;
    }

    .selection-banner-text {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .selection-banner-icon {
      color: var(--coral);
      font-size: 1.25rem;
    }

    .selection-banner-actions {
      display: flex;
      gap: 0.5rem;
    }

    .selection-action-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .selection-action-btn:hover {
      background: var(--bg-primary);
      border-color: var(--coral);
    }

    .filter-chip {
      padding: 0.625rem 1.25rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .filter-chip:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .filter-chip.active {
      background: var(--coral);
      color: white;
      border-color: var(--coral);
    }

    .filter-chip .count {
      opacity: 0.6;
      margin-left: 0.5rem;
    }

    /* Grid View */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
      animation: fadeInUp 0.8s ease 0.4s backwards;
    }

    .tool-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .tool-card.selecting {
      cursor: pointer;
    }

    .tool-card.selected {
      border-color: var(--coral);
      background: var(--coral-bg);
    }

    .tool-card.selected::after {
      content: '✓';
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 24px;
      height: 24px;
      background: var(--coral);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.875rem;
      animation: checkmark 0.3s ease;
    }

    @keyframes checkmark {
      0% {
        transform: scale(0) rotate(0deg);
      }
      50% {
        transform: scale(1.2) rotate(180deg);
      }
      100% {
        transform: scale(1) rotate(360deg);
      }
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--coral);
      transform: scaleX(0);
      transition: transform 0.3s;
    }

    .tool-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .tool-card:hover::before {
      transform: scaleX(1);
    }

    .tool-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
    }

    .tool-title {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .tool-name {
      font-size: 1.25rem;
      font-family: 'Crimson Pro', serif;
      font-weight: 600;
    }

    .tool-category {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tool-status {
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-new {
      background: rgba(74, 222, 128, 0.1);
      color: var(--success);
    }

    .status-updated {
      background: rgba(251, 191, 36, 0.1);
      color: var(--warning);
    }

    .status-stable {
      background: rgba(160, 160, 160, 0.1);
      color: var(--text-secondary);
    }

    .tool-description {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .tool-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.875rem;
      color: var(--text-tertiary);
    }

    .tool-meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .tool-links {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .tool-link {
      padding: 0.5rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .tool-link:hover {
      background: var(--bg-primary);
      border-color: var(--coral);
      color: var(--coral);
    }

    /* Timeline View */
    .timeline {
      display: none;
      max-width: 900px;
      margin: 0 auto;
    }

    .timeline.active {
      display: block;
      animation: fadeInUp 0.8s ease 0.4s backwards;
    }

    .timeline-item {
      display: flex;
      gap: 2rem;
      margin-bottom: 3rem;
      position: relative;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 3.5rem;
      top: 3rem;
      bottom: -3rem;
      width: 1px;
      background: var(--border);
    }

    .timeline-item:last-child::before {
      display: none;
    }

    .timeline-date {
      flex-shrink: 0;
      width: 120px;
      padding-top: 0.5rem;
    }

    .timeline-date-day {
      font-size: 1.5rem;
      font-family: 'Crimson Pro', serif;
      color: var(--coral);
    }

    .timeline-date-info {
      font-size: 0.875rem;
      color: var(--text-tertiary);
    }

    .timeline-content {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
    }

    .timeline-badge {
      position: absolute;
      left: -1.5rem;
      top: 1.5rem;
      width: 12px;
      height: 12px;
      background: var(--coral);
      border-radius: 50%;
      border: 3px solid var(--bg-primary);
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
    }

    .timeline-title {
      font-size: 1.25rem;
      font-family: 'Crimson Pro', serif;
    }

    .timeline-description {
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .timeline-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .timeline-tag {
      padding: 0.25rem 0.75rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Detail Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 200;
      padding: 2rem;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalSlideUp 0.4s ease;
      position: relative;
    }

    @keyframes modalSlideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      padding: 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: start;
    }

    .modal-title {
      font-size: 2rem;
      font-family: 'Crimson Pro', serif;
      margin-bottom: 0.5rem;
    }

    .modal-close {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: var(--coral);
      border-color: var(--coral);
    }

    .modal-body {
      padding: 2rem;
    }

    .modal-section {
      margin-bottom: 2rem;
    }

    .modal-section h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: var(--coral);
    }

    .modal-section p {
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .related-tools {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .related-tool {
      padding: 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .related-tool:hover {
      border-color: var(--coral);
    }

    .related-tool-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .related-tool-cat {
      font-size: 0.75rem;
      color: var(--text-tertiary);
    }

    /* Comparison View */
    .comparison-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 300;
      padding: 2rem;
      overflow-y: auto;
      animation: fadeIn 0.3s ease;
    }

    .comparison-modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .comparison-content {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 1400px;
      width: 100%;
      animation: modalSlideUp 0.4s ease;
      position: relative;
    }

    .comparison-header {
      padding: 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--bg-secondary);
      z-index: 10;
      border-radius: 16px 16px 0 0;
    }

    .comparison-title {
      font-size: 2rem;
      font-family: 'Crimson Pro', serif;
      color: var(--coral);
    }

    .comparison-body {
      padding: 2rem;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .comparison-column {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .comparison-column-header {
      padding: 1.5rem;
      background: var(--bg-primary);
      border-bottom: 2px solid var(--coral);
    }

    .comparison-column-name {
      font-size: 1.5rem;
      font-family: 'Crimson Pro', serif;
      margin-bottom: 0.5rem;
    }

    .comparison-column-category {
      font-size: 0.875rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .comparison-section {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .comparison-section:last-child {
      border-bottom: none;
    }

    .comparison-section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--coral);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .comparison-section-content {
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .comparison-metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .comparison-metric:last-child {
      border-bottom: none;
    }

    .comparison-metric-label {
      color: var(--text-tertiary);
      font-size: 0.875rem;
    }

    .comparison-metric-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .comparison-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .comparison-list li {
      padding: 0.5rem 0;
      display: flex;
      align-items: start;
      gap: 0.5rem;
    }

    .comparison-list li::before {
      content: '•';
      color: var(--coral);
      font-weight: bold;
      margin-top: 0.125rem;
    }

    .metric-bar {
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .metric-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--coral), var(--coral-dim));
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .comparison-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: var(--coral-bg);
      color: var(--coral);
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 1rem;
      }

      .tools-grid {
        grid-template-columns: 1fr;
      }

      .timeline-item {
        flex-direction: column;
        gap: 1rem;
      }

      .timeline-item::before {
        left: 0.5rem;
      }

      .timeline-badge {
        left: -0.25rem;
      }

      .rename-content {
        flex-direction: column;
        text-align: center;
      }

      .comparison-grid {
        grid-template-columns: 1fr !important;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-hover);
    }

    /* Loading animation for cards */
    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tool-card {
      animation: cardAppear 0.5s ease backwards;
    }

    .tool-card:nth-child(1) { animation-delay: 0.1s; }
    .tool-card:nth-child(2) { animation-delay: 0.15s; }
    .tool-card:nth-child(3) { animation-delay: 0.2s; }
    .tool-card:nth-child(4) { animation-delay: 0.25s; }
    .tool-card:nth-child(5) { animation-delay: 0.3s; }
    .tool-card:nth-child(6) { animation-delay: 0.35s; }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">🔮</div>
        <h1>AI Tool Tracker</h1>
      </div>
      <div class="header-actions">
        <button class="compare-btn" id="compareBtn" disabled>
          Compare (<span id="compareCount">0</span>)
        </button>
        <button class="selection-action-btn" id="enterCompareMode" style="display: block;">
          Select to Compare
        </button>

        selectedTools.splice(index, 1);
      } else {
        selectedTools.push(toolId);
      }
      updateCompareButton();
      renderGrid();
    }

    function updateCompareButton() {
      const compareBtn = document.getElementById('compareBtn');
      const compareCount = document.getElementById('compareCount');
      
      compareCount.textContent = selectedTools.length;
      
      if (selectedTools.length >= 2) {
        compareBtn.disabled = false;
        compareBtn.classList.add('active');
      } else {
        compareBtn.disabled = true;
        if (selectedTools.length === 0) {
          compareBtn.classList.remove('active');
        }
      }
    }

    function enterSelectionMode() {
      isSelectMode = true;
      document.getElementById('selectionBanner').classList.add('active');
      document.getElementById('enterCompareMode').style.display = 'none';
      renderGrid();
    }

    function exitSelectionMode() {
      isSelectMode = false;
      selectedTools = [];
      document.getElementById('selectionBanner').classList.remove('active');
      document.getElementById('enterCompareMode').style.display = 'block';
      updateCompareButton();
      renderGrid();
    }

    function clearSelection() {
      selectedTools = [];
      updateCompareButton();
      renderGrid();
    }

    function openComparison() {
      const modal = document.getElementById('comparisonModal');
      const body = document.getElementById('comparisonBody');
      
      const tools = selectedTools.map(id => toolsData.find(t => t.id === id));
      const category = tools[0].category;
      
      body.innerHTML = `
        <div class="comparison-grid">
          ${tools.map(tool => renderComparisonColumn(tool, category)).join('')}
        </div>
      `;
      
      modal.classList.add('active');
      
      // Animate metric bars after render
      setTimeout(() => {
        document.querySelectorAll('.metric-bar-fill').forEach(bar => {
          bar.style.width = bar.dataset.width;
        });
      }, 100);
    }

    function renderComparisonColumn(tool, category) {
      if (category === 'Models') {
        return renderModelComparison(tool);
      } else if (category === 'CLI Tools') {
        return renderCLIToolComparison(tool);
      } else if (category === 'Protocols') {
        return renderProtocolComparison(tool);
      } else {
        return renderGenericComparison(tool);
      }
    }

    function renderModelComparison(tool) {
      const data = tool.comparisonData;
      return `
        <div class="comparison-column">
          <div class="comparison-column-header">
            <div class="comparison-column-name">${tool.name}</div>
            <div class="comparison-column-category">${tool.category}</div>
          </div>
          
          <div class="comparison-section">
            <div class="comparison-section-title">Size & Architecture</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Parameters</span>
              <span class="comparison-metric-value">${data.parameters}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Context Window</span>
              <span class="comparison-metric-value">${data.contextWindow}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Training Data</span>
              <span class="comparison-metric-value">${data.trainingData}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Performance</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Speed</span>
              <span class="comparison-metric-value">${data.speed}/100</span>
            </div>
            <div class="metric-bar">
              <div class="metric-bar-fill" data-width="${data.speed}%" style="width: 0%"></div>
            </div>
            <div class="comparison-metric" style="margin-top: 1rem;">
              <span class="comparison-metric-label">Capability</span>
              <span class="comparison-metric-value">${data.capability}/100</span>
            </div>
            <div class="metric-bar">
              <div class="metric-bar-fill" data-width="${data.capability}%" style="width: 0%"></div>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Pricing</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Cost per M tokens</span>
              <span class="comparison-metric-value">${data.costPerMToken}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Strengths</div>
            <ul class="comparison-list">
              ${data.strengths.map(s => `<li>${s}</li>`).join('')}
            </ul>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Specializations</div>
            <div class="comparison-section-content">
              ${data.specializations.map(s => `<span class="comparison-badge">${s}</span>`).join(' ')}
            </div>
          </div>
        </div>
      `;
    }

    function renderCLIToolComparison(tool) {
      const data = tool.comparisonData;
      return `
        <div class="comparison-column">
          <div class="comparison-column-header">
            <div class="comparison-column-name">${tool.name}</div>
            <div class="comparison-column-category">${tool.category}</div>
          </div>
          
          <div class="comparison-section">
            <div class="comparison-section-title">Context & Models</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Context Window</span>
              <span class="comparison-metric-value">${data.contextWindow}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Context Approach</span>
            </div>
            <div class="comparison-section-content" style="margin-top: 0.5rem;">
              ${data.contextApproach}
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Supported Models</div>
            <ul class="comparison-list">
              ${data.supportedModels.map(m => `<li>${m}</li>`).join('')}
            </ul>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Protocol Support</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">MCP Support</span>
              <span class="comparison-metric-value">${data.mcpSupport ? '✓ Yes' : '✗ No'}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Skills Support</span>
              <span class="comparison-metric-value">${data.skillsSupport ? '✓ Yes' : '✗ No'}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Performance</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Avg Response Time</span>
              <span class="comparison-metric-value">${data.avgResponseTime}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Language Support</span>
              <span class="comparison-metric-value">${data.languageSupport}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Installation</div>
            <div class="comparison-section-content">
              <code style="background: var(--bg-primary); padding: 0.5rem; border-radius: 4px; display: block; font-size: 0.875rem; overflow-x: auto;">
                ${data.installMethod}
              </code>
            </div>
          </div>
        </div>
      `;
    }

    function renderProtocolComparison(tool) {
      const data = tool.comparisonData;
      return `
        <div class="comparison-column">
          <div class="comparison-column-header">
            <div class="comparison-column-name">${tool.name}</div>
            <div class="comparison-column-category">${tool.category}</div>
          </div>
          
          <div class="comparison-section">
            <div class="comparison-section-title">Protocol Info</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Version</span>
              <span class="comparison-metric-value">${data.protocolVersion}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Adoption</span>
              <span class="comparison-metric-value">${data.adoptionRate}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Ecosystem</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Ecosystem Size</span>
              <span class="comparison-metric-value">${data.ecosystemSize}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Documentation</span>
              <span class="comparison-metric-value">${data.documentationQuality}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Features</div>
            <ul class="comparison-list">
              ${tool.features.map(f => `<li>${f}</li>`).join('')}
            </ul>
          </div>
        </div>
      `;
    }

    function renderGenericComparison(tool) {
      return `
        <div class="comparison-column">
          <div class="comparison-column-header">
            <div class="comparison-column-name">${tool.name}</div>
            <div class="comparison-column-category">${tool.category}</div>
          </div>
          
          <div class="comparison-section">
            <div class="comparison-section-title">Overview</div>
            <div class="comparison-section-content">
              ${tool.description}
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Version</div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Current</span>
              <span class="comparison-metric-value">v${tool.version}</span>
            </div>
            <div class="comparison-metric">
              <span class="comparison-metric-label">Last Update</span>
              <span class="comparison-metric-value">${formatDate(tool.lastUpdate)}</span>
            </div>
          </div>

          <div class="comparison-section">
            <div class="comparison-section-title">Features</div>
            <ul class="comparison-list">
              ${tool.features.map(f => `<li>${f}</li>`).join('')}
            </ul>
          </div>
        </div>
      `;
    }

    function closeComparison() {
      document.getElementById('comparisonModal').classList.remove('active');
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Yesterday';
      if (diffDays < 7) return `${diffDays} days ago`;
      if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function filterTools(category) {
      currentCategory = category;
      if (category === 'all') {
        filteredTools = [...toolsData];
      } else {
        filteredTools = toolsData.filter(tool => tool.category === category);
      }
      renderGrid();
    }

    function switchView(view) {
      currentView = view;
      const gridView = document.getElementById('gridView');
      const timelineView = document.getElementById('timelineView');
      
      if (view === 'grid') {
        gridView.classList.add('active');
        gridView.style.display = 'grid';
        timelineView.classList.remove('active');
        timelineView.style.display = 'none';
      } else {
        timelineView.classList.add('active');
        timelineView.style.display = 'block';
        gridView.classList.remove('active');
        gridView.style.display = 'none';
        renderTimeline();
      }
    }

    // Event listeners
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filterTools(chip.dataset.category);
      });
    });

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        switchView(btn.dataset.view);
      });
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeModal();
    });

    document.getElementById('compareBtn').addEventListener('click', openComparison);
    document.getElementById('comparisonClose').addEventListener('click', closeComparison);
    document.getElementById('comparisonModal').addEventListener('click', (e) => {
      if (e.target.id === 'comparisonModal') closeComparison();
    });

    document.getElementById('clearSelection').addEventListener('click', clearSelection);
    document.getElementById('exitSelection').addEventListener('click', exitSelectionMode);
    document.getElementById('enterCompareMode').addEventListener('click', enterSelectionMode);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      // Press 'C' to toggle selection mode
      if (e.key === 'c' || e.key === 'C') {
        if (!isSelectMode && selectedTools.length === 0) {
          enterSelectionMode();
        }
      }
      // Press 'Escape' to exit selection mode or close modals
      if (e.key === 'Escape') {
        if (isSelectMode) {
          exitSelectionMode();
        }
      }
    });

    // Initial render
    renderGrid();
  </script>
</body>
</html>
